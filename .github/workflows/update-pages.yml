name: Update A-share Dashboard

on:
  schedule:
    # 17:10 and 19:10 Beijing time: use completed, source-dated close snapshots.
    - cron: "10 9 * * 1-5"
    - cron: "10 11 * * 1-5"
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: Read-only market source diagnostics without publishing
        type: boolean
        default: false
      collect_only:
        description: Fetch and validate free history without publishing
        type: boolean
        default: false
      restore_run:
        description: Optional prior free data artifact run for resuming a backfill
        type: string
        default: ''
  push:
    branches: [main, master]

concurrency:
  group: dashboard-update-${{ inputs.diagnose_only && 'diagnose' || inputs.collect_only && 'collect' || 'publish' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' && inputs.collect_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: dashboard-data-${{ github.run_id }}
          restore-keys: dashboard-data-
      - uses: actions/download-artifact@v4
        if: inputs.restore_run != ''
        with:
          name: free-market-data
          path: data
          run-id: ${{ inputs.restore_run }}
          github-token: ${{ github.token }}
      - run: python -u fetch_free_market.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-market-data
          path: |
            data/free
            data/stock_basic.csv
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: data
          key: dashboard-data-${{ github.run_id }}

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe source schemas and dates
        run: timeout 180s python -u diagnose_free_market.py

  build-and-deploy:
    if: ${{ !inputs.diagnose_only && !inputs.collect_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore last successful data snapshot
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dashboard-data-${{ github.run_id }}
          restore-keys: dashboard-data-

      - name: Install dependencies
        run: python -m pip install pandas numpy requests akshare beautifulsoup4

      - name: Verify free data handling
        run: python -m unittest test_pattern_watchlist.py test_dashboard_delivery.py test_market_source.py test_free_market.py

      - name: Refresh free stock-name discovery
        # This feed discovers securities only. Dates/prices come from verified histories.
        run: timeout 120s python fetch_intraday_free.py || echo "::warning::Symbol discovery failed; using known universe"

      - name: Refresh free daily data and backfill missing histories
        run: python -u fetch_free_market.py

      - name: Preserve dated historical reference
        run: timeout 240s python build_historical_archive.py || echo "::warning::Historical archive unavailable; latest free dashboard continues"

      - name: Build dashboard
        run: python build_free_dashboard.py

      - name: Save successful data snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: dashboard-data-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/market_dashboard

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report stale market data as an update failure
        # Preserve the usable website, but do not mark stale refreshes successful.
        run: |
          python -c "import json,sys; s=json.load(open('output/market_dashboard/data_status.json')); print(s['errors']); sys.exit(0 if s['ok'] else 1)"
